{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-3 py-3">
  <h1 class="h5 mb-3">категории</h1>

  <form class="card card-body mb-3" method="post" action="{{ url_for('category_create') }}">
    <div class="row g-2 align-items-end">
      <div class="col-md-6">
        <label class="form-label">новая категория</label>
        <input class="form-control" name="name" placeholder="например: обучение" required>
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100" type="submit">создать</button>
      </div>
    </div>
  </form>

  <div class="list-group">
    {% for c in categories %}
      <div class="list-group-item">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div class="fw-semibold">{{ c.name }}</div>

          <div class="d-flex gap-2 flex-wrap">
            <form class="d-flex gap-2" method="post" action="{{ url_for('category_rename', category_id=c.id) }}">
              <input class="form-control form-control-sm" name="name" placeholder="новое имя" required>
              <button class="btn btn-sm btn-outline-primary" type="submit">переименовать</button>
            </form>

            <form method="post" action="{{ url_for('category_delete', category_id=c.id) }}"
                  onsubmit="return confirm('удалить категорию? у ссылок она сбросится.');">
              <button class="btn btn-sm btn-outline-danger" type="submit">удалить</button>
            </form>

            <a class="btn btn-sm btn-outline-secondary"
               href="{{ url_for('links_list', category_id=c.id) }}">смотреть ссылки</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
